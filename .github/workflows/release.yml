name: Release

on:
  release:
    # published covers a fresh release or pre-release.
    # released additionally covers flipping an existing pre-release to a full
    # release, which is how a tested pre-release gets promoted to the stable
    # Nextcloud App Store channel without burning a version number.
    types: [published, released]

permissions:
  contents: write

# Whether a plain publish fires published, released, or both is not something to
# rely on, so keep at most one run per tag alive and let a later event supersede
# an earlier one. Both events arrive together, long before the publish step.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and attach release artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, zip, phar

      - name: Install dpkg tools
        run: sudo apt-get install -y dpkg-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Verify package.json version matches release tag
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          # A pre-release is tagged vX.Y.Z-pre. Everything after the first dash is a
          # marker for humans, the artifacts and the App Store still use plain X.Y.Z,
          # so it is stripped before comparing against package.json.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($GITHUB_REF_NAME)"
            exit 1
          fi
          echo "Version: $PKG_VERSION"
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT

      # Optional on purpose. Without the secret the release still builds, just
      # unsigned, rather than failing on a fork or before the key is configured.
      - name: Import the signing key
        id: gpg
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::No SIGNING_KEY secret, this release will be unsigned"
            exit 0
          fi
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          # The fingerprint is read back from the imported key rather than
          # written down anywhere, so there is one source of truth for which
          # key this is and no second secret to keep in step with the first.
          FPR=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')
          if [ -z "$FPR" ]; then
            echo "::error::SIGNING_KEY imported no secret key"
            exit 1
          fi
          # release.php shells out to gpg with no way to pass a passphrase, so
          # the agent has to answer without a terminal to prompt on
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --reload gpg-agent || true
          if [ -n "$SIGNING_KEY_PASSPHRASE" ]; then
            printf '%s' "$SIGNING_KEY_PASSPHRASE" > ~/.gnupg/passphrase
            chmod 600 ~/.gnupg/passphrase
            printf 'batch\npinentry-mode loopback\npassphrase-file %s/.gnupg/passphrase\n' "$HOME" >> ~/.gnupg/gpg.conf
          fi
          echo "fpr=$FPR" >> $GITHUB_OUTPUT
          echo "sign=--sign" >> $GITHUB_OUTPUT
          echo "Signing as $FPR"

      - name: Build release (JS/CSS + PHP archive + plugins)
        env:
          TACHYON_SIGNING_KEY: ${{ steps.gpg.outputs.fpr }}
        run: PATH="$PATH:node_modules/.bin" php cli/release.php --debian --nextcloud --owncloud --cpanel ${{ steps.gpg.outputs.sign }}

      # gpg failing leaves the build green and the artifacts unsigned, which is
      # only discovered by whoever tries to verify one. Checked here instead.
      - name: Verify the signatures and export the public key
        if: steps.gpg.outputs.sign != ''
        run: |
          V="${{ steps.version.outputs.version }}"
          D="build/dist/releases/webmail/$V"
          for f in "$D/tachyon-$V.tar.gz" "$D/tachyon-$V.zip"; do
            gpg --verify "$f.asc" "$f"
          done
          [ -f "$D/InRelease" ] && gpg --verify "$D/InRelease"
          [ -f "$D/Release.gpg" ] && gpg --verify "$D/Release.gpg" "$D/Release"
          # Shipped with the release it signs, so a user always has the key that
          # matches the artifacts they just downloaded
          gpg --armor --export "${{ steps.gpg.outputs.fpr }}" > "$D/tachyon-archive-keyring.asc"

      # The wiki and integrations/hestiacp/bin/v-add-sys-tachyon both fetch
      # tachyon-latest.tar.gz from releases/latest/download, which 404s while
      # every asset carries a version. Copies under stable names keep those
      # working without an edit per release. The existing upload globs already
      # match these, so no new entry is needed there.
      - name: Provide stable "latest" filenames
        run: |
          V="${{ steps.version.outputs.version }}"
          D="build/dist/releases/webmail/$V"
          cp "$D/tachyon-$V.tar.gz" "$D/tachyon-latest.tar.gz"
          cp "$D/tachyon-$V.zip"    "$D/tachyon-latest.zip"
          if [ -f "$D/tachyon_$V-1_all.deb" ]; then
            cp "$D/tachyon_$V-1_all.deb" "$D/tachyon_latest_all.deb"
          fi
          ls -1 "$D"

      # Attached to the release so translators can see where their language stands
      # without cloning the repository. build/dist is gitignored, so the
      # checkout in the next step leaves it alone.
      - name: Write the translation status report
        run: |
          I18N_REPORT="build/dist/releases/webmail/${{ steps.version.outputs.version }}/tachyon-${{ steps.version.outputs.version }}-translation-status.txt" \
            npx gulp i18n

      - name: Commit updated packages.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages.json
          git diff --cached --quiet || git commit -m "chore: update packages.json for $GITHUB_REF_NAME [skip ci]"
          git checkout -- .
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/releases/webmail/*/tachyon-*.tar.gz
            build/dist/releases/webmail/*/tachyon-*.zip
            build/dist/releases/webmail/*/tachyon_*.deb
            build/dist/releases/webmail/*/tachyon-*-nextcloud.tar.gz
            build/dist/releases/webmail/*/tachyon-*-owncloud.tar.gz
            build/dist/releases/webmail/*/tachyon-*-translation-status.txt
            build/dist/releases/webmail/*/tachyon-archive-keyring.asc
            build/dist/releases/plugins/*.tgz
            packages.json
            build/dist/releases/webmail/*/*.asc
            build/dist/releases/plugins/*.asc
            build/dist/releases/webmail/*/InRelease
            build/dist/releases/webmail/*/Release
            build/dist/releases/webmail/*/Release.gpg
            build/dist/releases/webmail/*/Packages
            build/dist/releases/webmail/*/Packages.gz

  publish-appstore:
    name: Publish to Nextcloud App Store
    runs-on: ubuntu-latest
    # needs: build already skips this if the build failed. A pre-release goes to
    # the nightly channel, a full release to stable, see the nightly input below.
    needs: build

    steps:
      - name: Publish to Nextcloud App Store
        uses: R0Wi/nextcloud-appstore-push-action@v1
        with:
          app_name: tachyon
          download_url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/tachyon-${{ needs.build.outputs.version }}-nextcloud.tar.gz
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          appstore_token: ${{ secrets.APPSTORE_TOKEN }}
          nightly: ${{ github.event.release.prerelease }}
