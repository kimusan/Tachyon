name: Release

on:
  release:
    # published covers a fresh release or pre-release.
    # released additionally covers flipping an existing pre-release to a full
    # release, which is how a tested pre-release gets promoted to the stable
    # Nextcloud App Store channel without burning a version number.
    types: [published, released]

permissions:
  contents: write

# Whether a plain publish fires published, released, or both is not something to
# rely on, so keep at most one run per tag alive and let a later event supersede
# an earlier one. Both events arrive together, long before the publish step.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and attach release artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, zip, phar

      - name: Install dpkg tools
        run: sudo apt-get install -y dpkg-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Verify package.json version matches release tag
        id: version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          # A pre-release is tagged vX.Y.Z-pre. Everything after the first dash is a
          # marker for humans, the artifacts and the App Store still use plain X.Y.Z,
          # so it is stripped before comparing against package.json.
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match release tag ($GITHUB_REF_NAME)"
            exit 1
          fi
          echo "Version: $PKG_VERSION"
          echo "version=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: Build release (JS/CSS + PHP archive + plugins)
        run: PATH="$PATH:node_modules/.bin" php cli/release.php --debian --nextcloud --owncloud

      # Attached to the release so translators can see where their language stands
      # without cloning the repository. build/dist is gitignored, so the
      # checkout in the next step leaves it alone.
      - name: Write the translation status report
        run: |
          I18N_REPORT="build/dist/releases/webmail/${{ steps.version.outputs.version }}/tachyon-${{ steps.version.outputs.version }}-translation-status.txt" \
            npx gulp i18n

      - name: Commit updated packages.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages.json
          git diff --cached --quiet || git commit -m "chore: update packages.json for $GITHUB_REF_NAME [skip ci]"
          git checkout -- .
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/releases/webmail/*/tachyon-*.tar.gz
            build/dist/releases/webmail/*/tachyon-*.zip
            build/dist/releases/webmail/*/tachyon_*.deb
            build/dist/releases/webmail/*/tachyon-*-nextcloud.tar.gz
            build/dist/releases/webmail/*/tachyon-*-owncloud.tar.gz
            build/dist/releases/webmail/*/tachyon-*-translation-status.txt
            build/dist/releases/plugins/*.tgz
            packages.json

  publish-appstore:
    name: Publish to Nextcloud App Store
    runs-on: ubuntu-latest
    # needs: build already skips this if the build failed. A pre-release goes to
    # the nightly channel, a full release to stable, see the nightly input below.
    needs: build

    steps:
      - name: Publish to Nextcloud App Store
        uses: R0Wi/nextcloud-appstore-push-action@v1
        with:
          app_name: tachyon
          download_url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/tachyon-${{ needs.build.outputs.version }}-nextcloud.tar.gz
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          appstore_token: ${{ secrets.APPSTORE_TOKEN }}
          nightly: ${{ github.event.release.prerelease }}
