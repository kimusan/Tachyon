<table class="table table-hover table-bordered" data-bind="i18nUpdate: f">
	<colgroup>
		<col>
		<col style="width: 100px">
		<col style="width: 80px">
	</colgroup>
	<tbody data-bind="foreach: f">
		<tr data-bind="css: {'disabled': !enabled() }">
			<td>
				<div>
					<span class="package-name" data-bind="text: name"></span>
					<a class="package-configure icon-settings" data-bind="visible: installed"></a>
					<a class="package-active" data-bind="visible: installed, css: enabled() ? 'icon-square-check' : 'icon-square'"></a>
					<span class="package-installed" data-bind="text: installed"></span>
				</div>
				<div class="package-desc" data-bind="text: desc"></div>
			</td>
			<td data-bind="text: version"></td>
			<td>
				<a class="icon-inbox" data-bind="visible: !loading() && canBeUpdated, click: function () { $root.installPackage($data); }"></a>
				&nbsp;
				<a class="icon-trash-2" data-bind="visible: !loading() && canBeDeleted, click: function () { $root.deletePackage($data); }"></a>
				<i class="icon-spinner" data-bind="visible: loading"></i>
			</td>
		</tr>
	</tbody>
</table>
