<div class="form-horizontal">
	<div class="legend" data-i18n="TAB_BRANDING/LEGEND_BRANDING"></div>
	<div class="control-group">
		<label data-i18n="TAB_BRANDING/LABEL_PAGE_TITLE"></label>
		<input class="span5" type="text" autocorrect="off" data-bind="textInput: title, saveTrigger: titleTrigger">
	</div>
	<div class="control-group">
		<label data-i18n="TAB_BRANDING/LABEL_LOADING_DESCRIPTION"></label>
		<input class="span5" type="text" autocorrect="off" data-bind="textInput: loadingDescription, saveTrigger: loadingDescriptionTrigger">
	</div>
	<div class="control-group">
		<label data-i18n="TAB_BRANDING/LABEL_FAVICON"></label>
		<div>
			<div data-bind="component: {
				name: 'Select',
				params: {
					options: faviconModeOptions,
					value: faviconMode,
					trigger: faviconModeTrigger,
					optionsText: 'name',
					optionsValue: 'id'
				}
			}"></div>
			<span class="help-block" data-i18n="TAB_BRANDING/HINT_FAVICON"></span>
		</div>
	</div>
	<div class="control-group" data-bind="visible: faviconExternal">
		<label data-i18n="TAB_BRANDING/LABEL_FAVICON_URL"></label>
		<input class="span5" type="text" placeholder="https://" autocorrect="off" data-bind="textInput: faviconUrl, saveTrigger: faviconUrlTrigger">
	</div>
	<div class="control-group" data-bind="visible: faviconCustom">
		<label data-i18n="TAB_BRANDING/LABEL_FAVICON_FILE"></label>
		<div>
			<div data-bind="visible: faviconFile()" style="display:none; margin-bottom: 8px;">
				<div class="logo-preview">
					<div class="logo-preview-tile is-light"><img class="favicon-preview" data-bind="attr: { src: faviconUploadUrl }" alt="Favicon"></div>
					<div class="logo-preview-tile is-dark"><img class="favicon-preview" data-bind="attr: { src: faviconUploadUrl }" alt="Favicon"></div>
				</div>
				<a href="#" class="btn btn-danger btn-small" data-bind="click: deleteFavicon" data-i18n="TAB_BRANDING/BUTTON_DELETE_LOGO"></a>
			</div>
			<p data-bind="visible: !faviconFile()" style="color: #999; margin-bottom: 8px;" data-i18n="TAB_BRANDING/LABEL_NO_LOGO"></p>
			<label class="btn btn-small" data-bind="css: { disabled: logoUploading() }">
				<input type="file" accept="image/svg+xml,image/png,image/x-icon,image/vnd.microsoft.icon,image/gif,image/webp" style="display:none"
					data-bind="event: { change: uploadFavicon }, disable: logoUploading">
				<span data-bind="visible: logoUploading()" data-i18n="GLOBAL/LOADING" style="display:none"></span>
				<span data-bind="visible: !logoUploading()" data-i18n="TAB_BRANDING/BUTTON_UPLOAD_LOGO"></span>
			</label>
			<span class="help-block" data-i18n="TAB_BRANDING/HINT_FAVICON_FILE"></span>
		</div>
	</div>

	<div class="control-group">
		<label data-i18n="TAB_BRANDING/LABEL_LOGIN_FOOTER"></label>
		<div>
			<textarea class="span5" rows="3" autocorrect="off" spellcheck="false"
				data-bind="textInput: loginFooter, saveTrigger: loginFooterTrigger"></textarea>
			<span class="help-block" data-i18n="TAB_BRANDING/HINT_LOGIN_FOOTER"></span>
		</div>
	</div>

	<div class="legend" data-i18n="TAB_BRANDING/LEGEND_LOGO"></div>
	<div class="control-group">
		<label data-i18n="TAB_BRANDING/LABEL_LOGO_MODE"></label>
		<div>
			<div data-bind="component: {
				name: 'Select',
				params: {
					options: logoModeOptions,
					value: loginLogoMode,
					trigger: loginLogoModeTrigger,
					optionsText: 'name',
					optionsValue: 'id'
				}
			}"></div>
			<span class="help-block" data-i18n="TAB_BRANDING/HINT_LOGO_MODE"></span>
		</div>
	</div>

	<div data-bind="visible: logoCustom">
		<div class="control-group">
			<label data-i18n="TAB_BRANDING/LABEL_LOGO_LIGHT"></label>
			<div>
				<div data-bind="visible: logoFile()" style="display:none; margin-bottom: 8px;">
					<div class="logo-preview">
						<div class="logo-preview-tile is-light"><img data-bind="attr: { src: logoUrl }" alt="Logo"></div>
					</div>
					<a href="#" class="btn btn-danger btn-small" data-bind="click: deleteLogo" data-i18n="TAB_BRANDING/BUTTON_DELETE_LOGO"></a>
				</div>
				<p data-bind="visible: !logoFile()" style="color: #999; margin-bottom: 8px;" data-i18n="TAB_BRANDING/LABEL_NO_LOGO"></p>
				<label class="btn btn-small" data-bind="css: { disabled: logoUploading() }">
					<input type="file" accept="image/png,image/jpeg,image/gif,image/svg+xml,image/webp" style="display:none"
						data-bind="event: { change: uploadLogo }, disable: logoUploading">
					<span data-bind="visible: logoUploading()" data-i18n="GLOBAL/LOADING" style="display:none"></span>
					<span data-bind="visible: !logoUploading()" data-i18n="TAB_BRANDING/BUTTON_UPLOAD_LOGO"></span>
				</label>
				<span class="help-block" data-i18n="TAB_BRANDING/HINT_LOGO_LIGHT"></span>
			</div>
		</div>

		<div class="control-group">
			<label data-i18n="TAB_BRANDING/LABEL_LOGO_DARK"></label>
			<div>
				<div data-bind="visible: logoFileDark()" style="display:none; margin-bottom: 8px;">
					<div class="logo-preview">
						<div class="logo-preview-tile is-dark"><img data-bind="attr: { src: logoDarkUrl }" alt="Logo"></div>
					</div>
					<a href="#" class="btn btn-danger btn-small" data-bind="click: deleteLogoDark" data-i18n="TAB_BRANDING/BUTTON_DELETE_LOGO"></a>
				</div>
				<p data-bind="visible: !logoFileDark()" style="color: #999; margin-bottom: 8px;" data-i18n="TAB_BRANDING/LABEL_NO_LOGO"></p>
				<label class="btn btn-small" data-bind="css: { disabled: logoUploading() }">
					<input type="file" accept="image/png,image/jpeg,image/gif,image/svg+xml,image/webp" style="display:none"
						data-bind="event: { change: uploadLogoDark }, disable: logoUploading">
					<span data-bind="visible: logoUploading()" data-i18n="GLOBAL/LOADING" style="display:none"></span>
					<span data-bind="visible: !logoUploading()" data-i18n="TAB_BRANDING/BUTTON_UPLOAD_LOGO"></span>
				</label>
				<span class="help-block" data-i18n="TAB_BRANDING/HINT_LOGO_DARK"></span>
			</div>
		</div>

		<div class="control-group">
			<label></label>
			<p class="text-error" style="display:none;" data-bind="visible: logoError(), text: logoError"></p>
		</div>
	</div>
</div>
