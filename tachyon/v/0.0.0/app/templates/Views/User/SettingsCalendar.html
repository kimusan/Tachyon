<form class="form-horizontal" spellcheck="false" data-bind="visible: allowCalendarSync">
	<div class="legend" data-i18n="SETTINGS_CALENDAR/LEGEND_CALENDAR_SYNC"></div>
	<div class="control-group">
		<label data-i18n="SETTINGS_CALENDAR/LABEL_CALENDAR_SYNC_ENABLE"></label>
		<div data-bind="component: {
			name: 'Select',
			params: {
				options: syncModeOptions,
				value: syncMode,
				optionsText: 'name',
				optionsValue: 'id'
			}
		}"></div>
	</div>
	<div class="control-group">
		<label data-i18n="SETTINGS_CALENDAR/LABEL_CALENDAR_SYNC_URL"></label>
		<input type="text" class="input-xxlarge" autocomplete="off" autocorrect="off" autocapitalize="off"
			spellcheck="false" data-bind="value: syncUrl" placeholder="https://">
	</div>
	<div class="control-group">
		<label data-i18n="SETTINGS_CALENDAR/LABEL_CALENDAR_SYNC_USER"></label>
		<input type="text" autocomplete="off" autocorrect="off" autocapitalize="off"
			data-bind="value: syncUser">
	</div>
	<div class="control-group">
		<label data-i18n="GLOBAL/PASSWORD"></label>
		<input type="password" autocomplete="current-password" autocorrect="off" autocapitalize="off"
			spellcheck="false" data-bind="value: syncPass">
	</div>
	<div class="control-group" data-bind="hidden: !syncUrl()">
		<label></label>
		<button class="btn" data-i18n="GLOBAL/TEST" data-bind="click: test, disable: testing"></button>
		<span data-bind="visible: testing"><i class="icon-spinner"></i></span>
	</div>
	<div class="alert alert-error" data-bind="visible: syncError, text: syncError"></div>
	<div class="alert alert-info" data-bind="visible: syncSuccess" data-i18n="SETTINGS_CALENDAR/TEST_OK"></div>
</form>
