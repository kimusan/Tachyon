<header class="b-header-toolbar g-ui-user-select-none">

	<a href="#" class="close" data-bind="click: tryToClose">×</a>

	<div class="btn-toolbar">

		<a class="btn btn-success" data-i18n="CALENDAR/BUTTON_NEW_EVENT" data-bind="command: newEventCommand"></a>

		<div class="btn-group">
			<a class="btn b-calendar-icon" data-i18n="[title]CALENDAR/BUTTON_PREV" data-bind="click: () => navigate(0)"><i class="icon-chevron-right b-calendar-flip"></i></a>
			<a class="btn" data-i18n="CALENDAR/BUTTON_TODAY" data-bind="click: () => today()"></a>
			<a class="btn b-calendar-icon" data-i18n="[title]CALENDAR/BUTTON_NEXT" data-bind="click: () => navigate(1)"><i class="icon-chevron-right"></i></a>
		</div>

		<span class="b-calendar-title" data-bind="text: title"></span>

		<div class="btn-group">
			<a class="btn" data-i18n="CALENDAR/VIEW_MONTH" data-bind="click: () => setView('dayGridMonth'),
				css: {'active': 'dayGridMonth' === currentView()}"></a>
			<a class="btn" data-i18n="CALENDAR/VIEW_WEEK" data-bind="click: () => setView('timeGridWeek'),
				css: {'active': 'timeGridWeek' === currentView()}"></a>
			<a class="btn" data-i18n="CALENDAR/VIEW_DAY" data-bind="click: () => setView('timeGridDay'),
				css: {'active': 'timeGridDay' === currentView()}"></a>
			<a class="btn" data-i18n="CALENDAR/VIEW_LIST" data-bind="click: () => setView('listWeek'),
				css: {'active': 'listWeek' === currentView()}"></a>
		</div>

		<a class="btn b-calendar-icon" data-i18n="[title]CALENDAR/BUTTON_SYNC" data-bind="click: () => syncCalendars(),
			css: {'disabled': loading()}"><svg class="b-calendar-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4z"/></svg></a>

		<span class="b-calendar-loading" data-bind="visible: loading()">
			<i class="icon-spinner"></i>
		</span>

	</div>

</header>
<div class="modal-body">

	<div class="left">
		<div class="b-calendar-list">
			<div class="listEmptyList" data-bind="visible: !calendars().length && !loading()"
				data-i18n="CALENDAR/EMPTY_LIST"></div>
			<!-- ko foreach: calendars -->
			<label class="e-calendar-item">
				<input type="checkbox" data-bind="checked: visible">
				<span class="e-calendar-color" data-bind="style: {'background-color': color || 'transparent'}"></span>
				<span class="e-calendar-name" data-bind="text: name"></span>
				<span class="e-calendar-readonly icon-lock" data-bind="visible: readOnly"
					data-i18n="[title]CALENDAR/READ_ONLY"></span>
			</label>
			<!-- /ko -->
		</div>
	</div>

	<div class="right">
		<div class="b-calendar-error" data-bind="visible: !!failed(), text: failed"></div>
		<div class="b-calendar-grid"></div>

		<div class="b-calendar-editor" data-bind="visible: editorVisible">
			<form class="b-calendar-editor-form" spellcheck="false" data-bind="css: {'read-only': editReadOnly()}">

				<div class="b-calendar-scope" data-bind="visible: editRecurring() && editRecurrenceId()">
					<a href="#" role="button" class="btn" data-bind="click: () => editScope('occurrence'),
						css: { 'btn-success': 'occurrence' === editScope() }" data-i18n="CALENDAR/SCOPE_OCCURRENCE"></a>
					<a href="#" role="button" class="btn" data-bind="visible: editCanSplit, click: () => editScope('following'),
						css: { 'btn-success': 'following' === editScope() }" data-i18n="CALENDAR/SCOPE_FOLLOWING"></a>
					<a href="#" role="button" class="btn" data-bind="click: () => editScope('series'),
						css: { 'btn-success': 'series' === editScope() }" data-i18n="CALENDAR/SCOPE_SERIES"></a>
				</div>
				<div class="b-calendar-editor-note" data-bind="visible: editRecurring() && 'series' === editScope()"
					data-i18n="CALENDAR/RECURRING_SERIES"></div>
				<div class="b-calendar-editor-note" data-bind="visible: editRecurring() && 'following' === editScope()"
					data-i18n="CALENDAR/RECURRING_FOLLOWING"></div>

				<div class="control-group">
					<label data-i18n="CALENDAR/LABEL_SUMMARY"></label>
					<input type="text" class="span5" data-bind="value: editSummary, enable: !editReadOnly()">
				</div>

				<div class="control-group">
					<label data-i18n="CALENDAR/LABEL_CALENDAR"></label>
					<!-- ko if: editUid -->
					<span class="b-calendar-editor-static" data-bind="text: editCalendarName"></span>
					<!-- /ko -->
					<!-- ko ifnot: editUid -->
					<div data-bind="component: {
						name: 'Select',
						params: {
							options: writableCalendars,
							value: editCalendar,
							optionsText: 'name',
							optionsValue: 'uuid'
						}
					}"></div>
					<!-- /ko -->
				</div>

				<div class="control-group">
					<label data-i18n="CALENDAR/LABEL_ALL_DAY"></label>
					<input type="checkbox" data-bind="checked: editAllDay, enable: !editReadOnly()">
				</div>

				<div class="control-group">
					<label data-i18n="CALENDAR/LABEL_START"></label>
					<!-- ko if: editAllDay -->
					<input type="date" data-bind="datePicker: editStart, enable: !editReadOnly()">
					<!-- /ko -->
					<!-- ko ifnot: editAllDay -->
					<div class="b-calendar-when">
					<input type="date" class="b-calendar-date" data-bind="datePicker: editStartDate, enable: !editReadOnly()">
					<!-- a text field, not type="time": a native time control takes its
					     format from the browser locale and ignores this app's hour cycle -->
					<input type="text" class="b-calendar-time" inputmode="numeric" autocomplete="off"
						list="calendar-times"
						data-bind="value: editStartTime, enable: !editReadOnly(), event: { focus: openTimeList }">
					</div>
					<!-- /ko -->
				</div>

				<div class="control-group">
					<label data-i18n="CALENDAR/LABEL_END"></label>
					<!-- ko if: editAllDay -->
					<input type="date" data-bind="datePicker: editEnd, enable: !editReadOnly()">
					<!-- /ko -->
					<!-- ko ifnot: editAllDay -->
					<div class="b-calendar-when">
					<input type="date" class="b-calendar-date" data-bind="datePicker: editEndDate, enable: !editReadOnly()">
					<!-- a text field, not type="time": a native time control takes its
					     format from the browser locale and ignores this app's hour cycle -->
					<input type="text" class="b-calendar-time" inputmode="numeric" autocomplete="off"
						list="calendar-times"
						data-bind="value: editEndTime, enable: !editReadOnly(), event: { focus: openTimeList }">
					</div>
					<!-- /ko -->
				</div>

				<!-- one occurrence has no rule of its own -->
				<div class="control-group" data-bind="visible: !(editRecurring() && 'occurrence' === editScope())">
					<label data-i18n="CALENDAR/LABEL_REPEAT"></label>
					<div data-bind="component: {
						name: 'Select',
						params: {
							options: repeatOptions,
							value: editRepeat,
							optionsText: 'name',
							optionsValue: 'id',
							disabled: editReadOnly
						}
					}"></div>
					<div class="b-calendar-editor-hint" data-bind="visible: editRuleCustom"
						data-i18n="CALENDAR/REPEAT_CUSTOM_HINT"></div>
				</div>

				<!-- visible rather than if throughout: the popup is translated once,
				     when it opens, and nodes an if adds later would keep their keys -->
				<div class="b-calendar-repeat" data-bind="visible: editRepeat() && !editRuleCustom()
					&& !(editRecurring() && 'occurrence' === editScope())">
					<div class="control-group">
						<label data-i18n="CALENDAR/REPEAT_EVERY"></label>
						<input type="number" min="1" max="999" class="b-calendar-interval"
							data-bind="value: editInterval, enable: !editReadOnly()">
						<span data-bind="text: repeatUnit"></span>
					</div>

					<div class="control-group" data-bind="visible: 'WEEKLY' === editRepeat()">
						<label data-i18n="CALENDAR/REPEAT_ON"></label>
						<div class="b-calendar-weekdays" data-bind="foreach: weekdayChoices">
							<!-- a link like the Save button: inside Nextcloud, its own CSS
							     restyles every button element and hid the selected state -->
							<a href="#" role="button" class="btn" data-bind="text: label,
								css: { 'btn-success': $parent.editWeekdays().includes(code), disabled: $parent.editReadOnly() },
								attr: { 'aria-pressed': $parent.editWeekdays().includes(code) ? 'true' : 'false' },
								click: () => $parent.toggleWeekday(code)"></a>
						</div>
					</div>

					<div class="control-group">
						<label data-i18n="CALENDAR/REPEAT_ENDS"></label>
						<div class="b-calendar-ends">
							<div data-bind="component: {
								name: 'Select',
								params: {
									options: repeatEndOptions,
									value: editEnds,
									optionsText: 'name',
									optionsValue: 'id',
									disabled: editReadOnly
								}
							}"></div>
							<span data-bind="visible: 'until' === editEnds()">
								<input type="date" data-bind="datePicker: editUntil, enable: !editReadOnly()">
							</span>
							<span data-bind="visible: 'count' === editEnds()">
								<input type="number" min="1" max="999" class="b-calendar-interval"
									data-bind="value: editCount, enable: !editReadOnly()">
								<span data-i18n="CALENDAR/REPEAT_TIMES"></span>
							</span>
						</div>
					</div>
				</div>

				<div class="control-group">
					<label data-i18n="CALENDAR/LABEL_LOCATION"></label>
					<input type="text" class="span5" data-bind="value: editLocation, enable: !editReadOnly()">
				</div>

				<div class="control-group">
					<label data-i18n="CALENDAR/LABEL_DESCRIPTION"></label>
					<textarea class="span5" rows="3" data-bind="value: editDescription, enable: !editReadOnly()"></textarea>
				</div>

				<datalist id="calendar-times" data-bind="foreach: timeSuggestions">
					<option data-bind="attr: { value: $data }"></option>
				</datalist>

				<div class="alert alert-error b-calendar-editor-error" data-bind="visible: !!editError(), text: editError"></div>

				<div class="buttons">
					<a class="btn btn-success" data-i18n="GLOBAL/SAVE" data-bind="command: saveEventCommand,
						visible: !editReadOnly()"></a>
					<a class="btn btn-danger" data-i18n="GLOBAL/DELETE" data-bind="command: deleteEventCommand,
						visible: !editReadOnly() && !!editUid()"></a>
					<a class="btn" data-i18n="GLOBAL/CANCEL" data-bind="click: () => closeEditor()"></a>
				</div>

			</form>
		</div>
	</div>

</div>
